<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#130f28"><title>Halloween English – Spooky School</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{color-scheme:dark;--bg:#120f26;--card:#211a3a;--ink:#faf6ef;--muted:#bdb3d2;--orange:#ffae45;--mint:#80e8c2}*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:radial-gradient(circle at 75% 0%,#3b265c 0,transparent 38%),var(--bg);color:var(--ink);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--mint);outline-offset:4px}.wrap{max-width:1080px;margin:auto;padding:22px 24px 60px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff20;padding-bottom:18px}.brand{font-weight:900;letter-spacing:.09em;font-size:14px}.brand span{color:var(--orange)}.tag{font-size:12px;color:#dfd3ec;font-weight:800;background:#ffffff12;border:1px solid #ffffff18;padding:7px 12px;border-radius:99px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:center;padding:54px 0 36px}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:900}h1{font-size:clamp(44px,7vw,76px);line-height:1.02;letter-spacing:-.05em;margin:15px 0}h1 em{font-style:normal;color:var(--orange)}p{color:var(--muted);line-height:1.6}.hero p{max-width:550px;font-size:17px}.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.pill{border:1px solid #ffffff20;border-radius:99px;padding:9px 14px;font-weight:800;font-size:13px;background:#ffffff09}.art{position:relative;min-height:260px;border-radius:28px;background:linear-gradient(150deg,#3e3169,#241c41);border:1px solid #ffffff19;display:grid;place-items:center;overflow:hidden}.moon{position:absolute;right:45px;top:25px;width:95px;height:95px;background:#ffe7a2;border-radius:50%;box-shadow:0 0 45px #ffe7a655}.scene{font-size:120px;position:relative;filter:drop-shadow(0 15px 8px #0008)}.bat{position:absolute;left:40px;top:35px;font-size:36px;transform:rotate(-15deg)}.spark{position:absolute;right:28px;bottom:24px;font-size:30px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:16px 0 20px}.sectionhead h2{font-size:26px;margin:0}.sectionhead p{font-size:13px;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.level{border:1px solid #ffffff19;background:#251e40;border-radius:18px;color:var(--ink);text-align:left;padding:17px;min-height:156px;display:flex;flex-direction:column;gap:10px;transition:.2s}.level:not(:disabled):hover{transform:translateY(-4px);border-color:#ffa95e;background:#302449}.level:disabled{opacity:.53;cursor:not-allowed}.level .ico{font-size:29px}.level strong{font-size:15px;line-height:1.25}.level small{color:var(--muted);margin-top:auto;font-size:12px}.foot{margin-top:30px;color:#958cab;font-size:12px;text-align:center}.screen{max-width:760px;margin:35px auto}.back{border:0;background:none;padding:8px 0;color:#c5b8d6;font-weight:800}.quiztop{display:flex;justify-content:space-between;gap:10px;margin:22px 0 10px;color:#d7cce3;font-size:14px;font-weight:800}.bar{height:9px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#80e8c2,#f6c96c);transition:width .3s}.box{margin-top:22px;border:1px solid #ffffff1c;border-radius:24px;background:#241d3d;padding:clamp(22px,5vw,42px);box-shadow:0 20px 60px #0003}.box h2{font-size:clamp(25px,4vw,36px);line-height:1.25;margin:12px 0 25px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{border:1px solid #ffffff25;text-align:left;border-radius:14px;background:#332a4d;color:white;padding:17px;min-height:64px;font-weight:800}.answer:not(:disabled):hover{border-color:var(--orange);background:#443451}.answer.correct{border-color:#80e8c2;background:#245347}.answer.wrong{border-color:#ff8585;background:#60313f}.answer:disabled{cursor:default}.feedback{min-height:42px;font-weight:800;margin:20px 0 5px;color:var(--mint)}.feedback.bad{color:#ffb7ae}.primary{border:0;background:var(--orange);color:#24172a;border-radius:12px;padding:14px 22px;font-weight:900}.primary:hover{background:#ffc575}.end{text-align:center}.end .big{font-size:68px}.end h2{margin:8px 0}.end .score{font-size:44px;font-weight:900;color:var(--orange)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.secondary{border:1px solid #ffffff2d;background:#ffffff0d;color:white;border-radius:12px;padding:13px 20px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr 0.7fr;gap:18px}.scene{font-size:85px}}@media(max-width:550px){.wrap{padding:18px 18px 40px}.hero{grid-template-columns:1fr;padding:38px 0 22px}.art{min-height:160px}.scene{font-size:70px}.moon{height:65px;width:65px}.grid{grid-template-columns:repeat(2,1fr)}.level{min-height:135px}.answers{grid-template-columns:1fr}.sectionhead{align-items:start}.tag{font-size:10px}.box{padding:22px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">🎃 SPOOKY <span>SCHOOL</span></div><div class="tag">ENGLISH · KLASSE 5</div></header><main id="app"></main><div class="foot">Dein Fortschritt bleibt auf diesem Gerät und in diesem Browser gespeichert.</div></div><script>
const vocab=[['ghost','Geist'],['witch','Hexe'],['bat','Fledermaus'],['pumpkin','Kürbis'],['spider','Spinne'],['skeleton','Skelett'],['vampire','Vampir'],['zombie','Zombie'],['haunted house','Spukhaus'],['gravestone','Grabstein'],['door','Tür'],['window','Fenster'],['roof','Dach'],['chimney','Schornstein'],['moon','Mond']];
const plurals=[['ghost','ghosts'],['witch','witches'],['bat','bats'],['pumpkin','pumpkins'],['spider','spiders'],['skeleton','skeletons'],['vampire','vampires'],['zombie','zombies'],['haunted house','haunted houses'],['gravestone','gravestones'],['door','doors'],['window','windows'],['roof','roofs'],['chimney','chimneys'],['mummy','mummies']];
const numberWords=['one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen'];
const meta=[['👻','Ghost words','Halloween-Wörter'],['🦇','Word magic','Deutsch → Englisch'],['🏚️','Haunted house','Haus und Umgebung'],['🧟','Monster twins','Einzahl & Mehrzahl'],['🔢','Count the ghosts','Zahlen & Mehrzahl'],['🕸️','There is / are','Eine oder mehrere?'],['🧪','Word potion','Nomen, Verben, Adjektive'],['📜','Spooky sentences','Sätze übersetzen'],['🔍','Find the mistake','Sätze genau prüfen'],['🎃','Final challenge','Neue Aufgaben · alles gemischt']];
const Q=(q,a,wrong)=>({q,a,wrong});
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickWrong=(arr,correct,n=3)=>shuffle([...new Set(arr)].filter(x=>x!==correct)).slice(0,n);
const trans=(pairs,reverse=false)=>pairs.map(([en,de])=>{let a=reverse?en:de;return Q(reverse?`Was heißt „${de}“ auf Englisch?`:`Was heißt „${en}“ auf Deutsch?`,a,pickWrong(pairs.map(x=>x[reverse?0:1]),a))});
let levels=[];
levels[0]=trans(vocab);levels[1]=trans(vocab,true);
const house=[['door','Tür'],['window','Fenster'],['roof','Dach'],['chimney','Schornstein'],['stairs','Treppe'],['moon','Mond'],['haunted house','Spukhaus'],['gravestone','Grabstein'],['spiderweb','Spinnennetz'],['broomstick','Besen'],['sky','Himmel'],['garden','Garten'],['bed','Bett'],['room','Zimmer'],['coffin','Sarg']];levels[2]=trans(house);
levels[3]=plurals.map(([s,p])=>Q(`One ${s} – two …`,p,[s,p+'s',s+'es'].filter((x,i,a)=>x!==p&&a.indexOf(x)===i).concat(['monster','ghosts']).filter(x=>x!==p).slice(0,3)));
levels[4]=numberWords.map((word,i)=>{const noun=i===0?'ghost':['ghosts','bats','pumpkins','spiders','witches'][i%5];return Q(`Ergänze die Zahl: ${i+1} ${noun} = ___ ${noun}.`,word,pickWrong(numberWords,word))});
const there=[['a ghost','in the house',1],['two bats','in the sky',2],['one pumpkin','by the door',1],['four spiders','under the bed',4],['a witch','on a broomstick',1],['three ghosts','in the house',3],['a vampire','in the coffin',1],['ten gravestones','in the garden',10],['a spiderweb','in my room',1],['six zombies','in the garden',6],['one skeleton','by the window',1],['five pumpkins','on the stairs',5],['a bat','on the roof',1],['two witches','in the house',2],['a mummy','in the coffin',1]];
levels[5]=there.map(([n,loc,num])=>Q(`There ___ ${n} ${loc}.`,num===1?'is':'are',[num===1?'are':'is','am','be']));
const types=[['pumpkin','Nomen'],['ghost','Nomen'],['zombie','Nomen'],['vampire','Nomen'],['witch','Nomen'],['play','Verb'],['eat','Verb'],['go','Verb'],['watch','Verb'],['scary','Adjektiv'],['dark','Adjektiv'],['white','Adjektiv'],['spooky','Adjektiv'],['spider','Nomen'],['roof','Nomen']];levels[6]=types.map(([w,t])=>Q(`Welche Wortart ist „${w}“?`,t,['Nomen','Verb','Adjektiv'].filter(x=>x!==t)));
const sentences=[['Es gibt einen Geist im Haus.','There is a ghost in the house.','There are ghosts in the house.','There is a witch in the house.','There is a ghost on the roof.'],['Es gibt zwei Fledermäuse am Himmel.','There are two bats in the sky.','There is one bat in the sky.','There are two bats in the house.','There are two ghosts in the sky.'],['Der Mond ist am Himmel.','The moon is in the sky.','The moon is in the house.','The bat is in the sky.','The roof is in the sky.'],['Die Hexe ist auf einem Besen.','The witch is on a broomstick.','The ghost is on a broomstick.','The witch is under the bed.','The bat is on the roof.'],['Die Spinne ist auf der Treppe.','The spider is on the stairs.','The spider is on the roof.','The bat is on the stairs.','The spider is under the bed.'],['Es gibt einen Kürbis an der Tür.','There is a pumpkin by the door.','There are pumpkins by the door.','There is a ghost by the door.','There is a pumpkin by the window.'],['Das Spukhaus ist dunkel.','The haunted house is dark.','The haunted house is white.','The ghost is dark.','The moon is white.'],['Es gibt vier Geister im Haus.','There are four ghosts in the house.','There is one ghost in the house.','There are four witches in the house.','There are four ghosts in the garden.'],['There is a spider under the bed.','Es gibt eine Spinne unter dem Bett.','Es gibt zwei Spinnen unter dem Bett.','Es gibt eine Spinne auf dem Bett.','Es gibt eine Fledermaus unter dem Bett.'],['The ghost is white.','Der Geist ist weiß.','Der Geist ist dunkel.','Die Hexe ist weiß.','Der Kürbis ist weiß.'],['There are two zombies in the garden.','Es gibt zwei Zombies im Garten.','Es gibt einen Zombie im Garten.','Es gibt zwei Zombies im Haus.','Es gibt zwei Vampire im Garten.'],['The bat is on the roof.','Die Fledermaus ist auf dem Dach.','Die Fledermaus ist am Fenster.','Die Spinne ist auf dem Dach.','Der Geist ist auf dem Dach.'],['There is a vampire in the coffin.','Es gibt einen Vampir im Sarg.','Es gibt zwei Vampire im Sarg.','Es gibt einen Geist im Sarg.','Es gibt einen Vampir im Garten.'],['There are five pumpkins by the door.','Es gibt fünf Kürbisse an der Tür.','Es gibt vier Kürbisse an der Tür.','Es gibt fünf Kürbisse am Fenster.','Es gibt einen Kürbis an der Tür.'],['The witch is scary.','Die Hexe ist unheimlich.','Die Hexe ist weiß.','Der Geist ist unheimlich.','Die Hexe spielt.']];levels[7]=sentences.map(([q,a,...w])=>Q(`Übersetze: ${q}`,a,w));
levels[8]=there.map(([n,loc,num])=>{let v=num===1?'is':'are',bad=num===1?'are':'is';let a=`There ${v} ${n} ${loc}.`;return Q('Welcher Satz ist richtig?',a,[`There ${bad} ${n} ${loc}.`,`There ${n} ${v} ${loc}.`,`There am ${n} ${loc}.`])});
levels[9]=[
 Q('There ___ seven bats in the dark sky.','are',['is','am','be']),
 Q('There ___ one scary witch by the window.','is',['are','am','be']),
 Q('One mummy – three ___.','mummies',['mummys','mummy','mummyes']),
 Q('One witch – five ___.','witches',['witchs','witch','witchies']),
 Q('Übersetze: Es gibt drei Spinnen auf dem Dach.','There are three spiders on the roof.',['There is one spider on the roof.','There are three bats on the roof.','There are three spiders under the bed.']),
 Q('Übersetze: Ein Geist ist im Spukhaus.','There is a ghost in the haunted house.',['There are ghosts in the haunted house.','There is a witch in the haunted house.','There is a ghost in the garden.']),
 Q('Was heißt: There are ten pumpkins in the garden?','Es gibt zehn Kürbisse im Garten.',['Es gibt einen Kürbis im Garten.','Es gibt zehn Kürbisse im Haus.','Es gibt zehn Geister im Garten.']),
 Q('Welcher Satz ist richtig?','There are two witches on broomsticks.',['There is two witches on broomsticks.','There are two witch on broomsticks.','There are two witchs on broomsticks.']),
 Q('Welcher Satz ist richtig?','There is a spider by the door.',['There are a spider by the door.','There is a spiders by the door.','There a spider is by the door.']),
 Q('Ergänze: The ghost is ___. (weiß)','white',['watch','spider','eat']),
 Q('Welches Wort ist ein Verb?','watch',['scary','vampire','dark']),
 Q('Welches Wort ist ein Adjektiv?','spooky',['ghost','play','pumpkin']),
 Q('Übersetze: Die Fledermaus ist am Fenster.','The bat is by the window.',['The bat is on the roof.','The ghost is by the window.','The bat is under the bed.']),
 Q('There are ___ ghosts. (neun)','nine',['six','seven','ten']),
 Q('Welcher Satz ist richtig?','There are six zombies in the garden.',['There is six zombies in the garden.','There are six zombie in the garden.','There are six zombys in the garden.'])
];
// In den späteren Levels wird zunehmend selbst geschrieben.
const typing=(q,a)=>({q,a,wrong:[],typing:true});
for(let i=0;i<5;i++)levels[5][i]=typing(levels[5][i].q,levels[5][i].a);
[['Geist','ghost'],['Hexe','witch'],['Kürbis','pumpkin'],['Spinne','spider'],['Fledermaus','bat'],['Fenster','window']].forEach(([de,en],i)=>levels[6][i]=typing(`Schreibe auf Englisch: ${de}`,en));
[
 ['There is a ___ in the house. (Geist)','ghost'],
 ['There are two ___ in the sky. (Fledermäuse)','bats'],
 ['The ___ is in the sky. (Mond)','moon'],
 ['The witch is on a ___. (Besen)','broomstick'],
 ['The spider is on the ___. (Treppe)','stairs'],
 ['There is a pumpkin by the ___. (Tür)','door'],
 ['The haunted house is ___. (dunkel)','dark']
].forEach(([q,a],i)=>levels[7][i]=typing(q,a));
[
 ['Verbessere das Wort: There is two bats. → There ___ two bats.','are'],
 ['Verbessere das Wort: There are a ghost. → There ___ a ghost.','is'],
 ['Verbessere die Mehrzahl: two witchs → two ___','witches'],
 ['Verbessere die Mehrzahl: three zombie → three ___','zombies'],
 ['Verbessere das Wort: The ghost is wite. → The ghost is ___. (weiß)','white'],
 ['Verbessere das Wort: There is a gost. → There is a ___. (Geist)','ghost'],
 ['Verbessere das Wort: a pumkin → a ___. (Kürbis)','pumpkin'],
 ['Verbessere das Wort: The moon is in the skye. → The moon is in the ___.','sky']
].forEach(([q,a],i)=>levels[8][i]=typing(q,a));
[
 ['There ___ seven bats in the dark sky.','are'],
 ['There ___ one scary witch by the window.','is'],
 ['One mummy – three ___.','mummies'],
 ['One witch – five ___.','witches'],
 ['There are three ___ on the roof. (Spinnen)','spiders'],
 ['There is a ___ in the haunted house. (Geist)','ghost'],
 ['There are ten ___ in the garden. (Kürbisse)','pumpkins'],
 ['The ghost is ___. (weiß)','white'],
 ['The bat is by the ___. (Fenster)','window'],
 ['There are ___ ghosts. (neun)','nine']
].forEach(([q,a],i)=>levels[9][i]=typing(q,a));
const visuals=[[/haunted house|spukhaus/i,'🏚️'],[/spiderweb|spinnennetz/i,'🕸️'],[/gravestone|grabstein/i,'🪦'],[/broomstick|besen/i,'🧹'],[/pumpkin|kürbis/i,'🎃'],[/ghost|geist/i,'👻'],[/witch|hex[en]/i,'🧙‍♀️'],[/bats?\b|fledermaus|fledermäus/i,'🦇'],[/spider|spinne/i,'🕷️'],[/skeleton|skelett/i,'💀'],[/vampire|vampir/i,'🧛'],[/zombie/i,'🧟'],[/mumm(?:y|ies)|mumie/i,'🤕'],[/chimney|schornstein/i,'🏭'],[/window|fenster/i,'🪟'],[/door|tür/i,'🚪'],[/roof|dach/i,'🏠'],[/stairs|treppe/i,'🪜'],[/moon|mond/i,'🌙'],[/sky|himmel/i,'🌌'],[/garden|garten/i,'🌳'],[/bed|bett/i,'🛏️'],[/room|zimmer/i,'🛋️'],[/coffin|sarg/i,'⚰️'],[/white|weiß/i,'⚪'],[/dark|dunkel/i,'🌑'],[/scary|spooky|unheimlich/i,'😱']];
function picture(text){return [...new Set(visuals.filter(([pattern])=>pattern.test(text)).map(([,emoji])=>emoji))].slice(0,3).join(' ')}
let unlocked=1,best={};try{let saved=JSON.parse(localStorage.getItem('spooky-school-v1')||'{}');unlocked=Math.min(10,Math.max(1,saved.unlocked||1));best=saved.best||{}}catch(e){}let level=0,index=0,score=0,answered=false;const app=document.getElementById('app');
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">✦ Dein Englisch-Abenteuer ✦</div><h1>Learn English.<br><em>Get spooky.</em></h1><p>Willkommen im Spukhaus! Übe Englisch mit Geistern, Hexen und Kürbissen. Schaffst du alle 10 Level?</p><div class="pills"><span class="pill">👻 10 Level</span><span class="pill">✏️ 15 Aufgaben je Level</span><span class="pill">🔑 11 richtige = weiter</span></div></div><div class="art" aria-hidden="true"><div class="moon"></div><div class="bat">🦇</div><div class="scene">🏚️</div><div class="spark">🎃 👻</div></div></section><section><div class="sectionhead"><div><div class="eyebrow">Deine Mission</div><h2>Wähle ein Level</h2><p>Mindestens 11 von 15 richtig? Das nächste Level wird frei!</p></div><div class="tag">${unlocked} / 10 FREI</div></div><div class="grid">${meta.map(([icon,title,sub],i)=>`<button class="level" ${i>=unlocked?'disabled':''} data-level="${i}"><span class="ico">${i>=unlocked?'🔒':icon}</span><strong>${i+1}. ${title}</strong><small>${i>=unlocked?'Noch gesperrt':best[i]!=null?`Bestes Ergebnis: ${best[i]} / 15` :sub}</small></button>`).join('')}</div></section>`;app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));window.scrollTo(0,0)}
function start(n){level=n;index=0;score=0;showQuestion();window.scrollTo(0,0)}
function showQuestion(){answered=false;const item=levels[level][index],opts=shuffle([item.a,...item.wrong]),hint=picture(item.q);app.innerHTML=`<div class="screen"><button class="back">← Zur Levelauswahl</button><div class="quiztop"><span>${meta[level][0]} LEVEL ${level+1} · ${meta[level][1]}</span><span>${index+1} / 15</span></div><div class="bar"><span style="width:${index/15*100}%"></span></div><div class="box"><div class="eyebrow">${item.typing?'Tippe deine Antwort':'Wähle die richtige Antwort'}</div><div class="visual" aria-hidden="true" style="font-size:48px;line-height:1.3;margin-top:12px"></div><h2></h2><div class="answers"></div><div class="feedback" role="status" aria-live="polite"></div><button class="primary next" hidden>Weiter →</button></div></div>`;app.querySelector('.back').onclick=home;app.querySelector('.visual').textContent=hint;app.querySelector('h2').textContent=item.q;const container=app.querySelector('.answers');const norm=x=>x.trim().replace(/\s+/g,' ').toLocaleLowerCase();function grade(value,chosen){if(answered)return;if(!value.trim())return;answered=true;const ok=norm(value)===norm(item.a);if(ok)score++;container.querySelectorAll('button,input').forEach(el=>{el.disabled=true;if(el.dataset.correct==='true')el.classList.add('correct')});if(!ok&&chosen)chosen.classList.add('wrong');let fb=app.querySelector('.feedback');fb.className='feedback'+(ok?'':' bad');fb.textContent=ok?'Richtig! Super! ✨':`Fast! Richtig ist: ${item.a}`;const next=app.querySelector('.next');next.hidden=false;next.focus()};if(item.typing){container.style.display='block';const form=document.createElement('form');form.style.display='flex';form.style.flexWrap='wrap';form.style.gap='12px';const input=document.createElement('input');input.type='text';input.autocomplete='off';input.autocapitalize='none';input.spellcheck=false;input.placeholder='Deine Antwort …';input.setAttribute('aria-label','Deine Antwort');input.required=true;input.style.cssText='flex:1;min-width:170px;padding:16px;border:1px solid #ffffff50;border-radius:14px;background:#332a4d;color:white;font:inherit;font-weight:800';const submit=document.createElement('button');submit.type='submit';submit.className='primary';submit.textContent='Prüfen ✓';form.append(input,submit);form.onsubmit=e=>{e.preventDefault();grade(input.value)};container.appendChild(form)}else{opts.forEach(opt=>{const b=document.createElement('button');b.className='answer';b.textContent=opt;b.onclick=()=>grade(opt,b);b.dataset.correct=String(opt===item.a);container.appendChild(b)})}app.querySelector('.next').onclick=()=>{index++;if(index===15)finish();else showQuestion()}}
function finish(){const pass=score>=11;best[level]=Math.max(best[level]||0,score);if(pass&&level+1<10)unlocked=Math.max(unlocked,level+2);try{localStorage.setItem('spooky-school-v1',JSON.stringify({unlocked,best}))}catch(e){}app.innerHTML=`<div class="screen"><div class="box end"><div class="big">${pass?'🎉':'👻'}</div><div class="eyebrow">Level ${level+1} geschafft?</div><h2>${pass?'Monsterstark!':'Fast geschafft!'}</h2><div class="score">${score} / 15</div><p>${pass?(level===9?'Du hast alle zehn Level abgeschlossen!':'Das nächste Level ist jetzt frei!'):`Für das nächste Level brauchst du mindestens 11 richtige Antworten. Versuch es noch einmal!`}</p><div class="actions"><button class="secondary retry">Nochmal spielen</button><button class="primary onward">${pass&&level<9?'Nächstes Level →':'Zur Levelauswahl'}</button></div></div></div>`;app.querySelector('.retry').onclick=()=>start(level);app.querySelector('.onward').onclick=()=>pass&&level<9?start(level+1):home()}
home();
</script></body></html>
